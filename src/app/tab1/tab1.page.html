<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Expenses</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Expenses</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Add no active budget message -->
  <div *ngIf="!budget">
    <ion-text color="dark">
      <p>No active budget found. Please create a budget first.</p>
    </ion-text>
  </div>

  <!-- Expenses List -->
  <ion-list>
    <ion-item *ngFor="let expense of expenses" (click)="viewExpense(expense)">
      <ion-label>
        <h2>{{ expense.description }}</h2>
        <p>{{ expense.date | date }}</p>
      </ion-label>
      <ion-note slot="end" color="primary">
        R{{ expense.amount }}
      </ion-note>
    </ion-item>
  </ion-list>

  <!-- Floating Action Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="budget">
    <ion-fab-button (click)="addExpense()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
